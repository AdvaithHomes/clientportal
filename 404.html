<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Advaith Homes Client Portal</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 to index.html with the route preserved in the hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repo = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repo + '/#/' + path + (l.search ? (path ? '&' : '?') + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
